name: tests

on:
  push:
    branches: [main, master, gymnasium]
  pull_request:
    branches: [main, master, gymnasium]
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 3.8 = ROS Noetic's bundled Python (supported runtime).
        # 3.10 = forward-compat check.
        # 3.12 blocked on setup.py distutils → setuptools migration.
        python-version: ["3.8", "3.10"]

    steps:
      - name: Check out realros
        uses: actions/checkout@v4
        with:
          path: realros

      # realros's proxy class + shared utilities live in UniROS after
      # Round 8.1 / 8.2. We need UniROS importable for tests to run.
      - name: Check out UniROS
        uses: actions/checkout@v4
        with:
          repository: ncbdrck/UniROS
          path: UniROS

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install catkin_pkg pytest
          pip install gymnasium gymnasium_robotics numpy
          pip install -e UniROS/uniros
          pip install -e realros

      - name: Run pytest
        working-directory: realros
        run: pytest tests/ -v
