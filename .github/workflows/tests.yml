name: tests

on:
  push:
    branches: [main, master, gymnasium, cleanup-2026]
  pull_request:
    branches: [main, master, gymnasium, cleanup-2026]
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 3.8 = ROS Noetic's bundled Python (supported runtime).
        # 3.10 = forward-compat check.
        # 3.12 blocked on setup.py distutils → setuptools migration.
        python-version: ["3.8", "3.10"]

    steps:
      - name: Check out realros
        uses: actions/checkout@v4
        with:
          path: realros

      # realros's proxy class + shared utilities live in UniROS. Clone the
      # branch matching whatever branch this workflow is running on, so a PR
      # or push on realros's cleanup-2026 pulls UniROS's cleanup-2026, etc.
      - name: Check out UniROS
        uses: actions/checkout@v4
        with:
          repository: ncbdrck/UniROS
          ref: ${{ github.head_ref || github.ref_name }}
          path: UniROS

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # setup.py imports catkin_pkg + uses distutils. Install build deps in
          # the OUTER env, then pass --no-build-isolation to pip install so the
          # build subprocess can see them.
          pip install setuptools wheel catkin_pkg pytest
          # Pin gymnasium to match the supported runtime.
          pip install "gymnasium==0.29.1" "gymnasium_robotics==1.2.4" numpy
          pip install -e UniROS/uniros --no-build-isolation
          pip install -e realros --no-build-isolation

      - name: Run pytest
        working-directory: realros
        run: pytest tests/ -v
